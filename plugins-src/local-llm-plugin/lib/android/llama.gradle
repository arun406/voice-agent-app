// Applied into the generated app/build.gradle via plugin.xml's
// <framework type="gradleReference">. Wires the CMake project in
// ../../src/android/cpp (llama_bridge.cpp + vendored llama.cpp) into the build so
// LlamaBridge.kt's System.loadLibrary("llama_bridge") resolves at runtime.
//
// Verified path: app/build.gradle lives at cordova-app/platforms/android/app/, and
// installed plugins land at cordova-app/plugins/<id>/ — three levels up from app/,
// not four (cordova-app/platforms/android/app/ -> android/ -> platforms/ -> cordova-app/).
android {
    // Without this, AGP picks its own default NDK version for external native builds
    // and silently downloads it even if a perfectly usable NDK is already installed
    // (in this project's case, a ~1.5GB redundant download of NDK 27.x instead of
    // reusing the 26.1.10909125 already installed alongside the SDK).
    ndkVersion "26.1.10909125"
    externalNativeBuild {
        cmake {
            path "../../../plugins/com.nothing.voiceagent.localllm/src/android/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    defaultConfig {
        externalNativeBuild {
            cmake {
                // GGML_CPU_ARM_ARCH: without it, ggml's CPU backend falls back to a
                // generic scalar path for quantized matmul (the bulk of inference
                // cost) instead of ARM's dot-product/fp16 vector instructions —
                // measured as the difference between multi-minute and few-second
                // responses on the Nothing 4a's Snapdragon chip. armv8.2-a+dotprod+fp16
                // is safe on any phone from roughly 2019 onward.
                //
                // CMAKE_BUILD_TYPE=Release: AGP's external native build defaults to
                // Debug for a debug APK variant (-O0, no vectorization/loop unrolling)
                // regardless of -march — measured at ~1 token/sec either way for prefill
                // AND generation (they should differ by 10-50x when the fast path is
                // actually used), which is the real signature of this exact problem.
                // Forcing Release here keeps the Kotlin/Java side debuggable while the
                // compute-heavy native library still gets real optimization.
                arguments "-DANDROID_STL=c++_shared", "-DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16", "-DCMAKE_BUILD_TYPE=Release"
                abiFilters "arm64-v8a"
            }
        }
    }
}
