// cordova-android's generated app module is Java-only by default; this enables Kotlin
// compilation so LocalLLMPlugin.kt / LlamaBridge.kt (and native-assist-plugin's Kotlin
// files, if both plugins are installed) actually build. Guarded with hasPlugin so
// installing both plugins doesn't try to apply this twice regardless of install order —
// native-assist-plugin/lib/android/kotlin.gradle is the identical file for the same reason.
if (!project.plugins.hasPlugin('kotlin-android')) {
    apply plugin: 'kotlin-android'
}

// Without this, Kotlin defaults its JVM target to match the JDK running Gradle (21
// here) while cordova-android's own Java compile tasks target 11, and Gradle refuses
// to link the two ("Inconsistent JVM-target compatibility").
android {
    kotlinOptions {
        jvmTarget = "11"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
